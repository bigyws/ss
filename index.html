<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>차량 소모품 알림</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mu:#6b7280;--ln:#e5e7eb;--pri:#2563eb;--ok:#16a34a;--soon:#d97706;--over:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.alert{border-color:#fca5a5;background:#fef2f2}.alert.soon{border-color:#fcd34d;background:#fffbeb}
input,button{font:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:#eef2ff;color:var(--pri)}button.gr{background:#f3f4f6;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.mu{color:var(--mu);font-size:14px}
.badge{font-size:13px;padding:2px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.b-ok{background:var(--ok)}.b-soon{background:var(--soon)}.b-overdue{background:var(--over)}.b-none{background:#9ca3af}
.item-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.item-h b{font-size:17px}.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btns button{padding:7px 11px;font-size:14px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:#0006}label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.top{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;max-width:90vw;z-index:9}
</style></head><body><div class="wrap" id="app"></div>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<input type="file" id="restoreFile" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>
<script>
// ==CORE== (날짜·주행거리 계산)
const WARN_DAYS = 30;   // 교체일 1개월 전부터 알림
const WARN_KM = 300;    // 교체 주행거리 300km 전부터 알림
const DEFAULTS = [
  ["엔진오일",10000,6],["브레이크오일",40000,24],["에어컨필터",15000,12],["에어클리너",20000,12],
  ["미션오일",60000,48],["냉각수",40000,24],["브레이크패드",30000,null],["배터리",null,36],["와이퍼",null,12]];
const pad = n => String(n).padStart(2,'0');
function todayStr(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function addMonths(iso,m){
  const [y,mo,d]=iso.split('-').map(Number), idx=mo-1+m;
  const ny=y+Math.floor(idx/12), nm=((idx%12)+12)%12;
  const dim=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();
  return ny+'-'+pad(nm+1)+'-'+pad(Math.min(d,dim));
}
function daysBetween(a,b){
  const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
  return Math.round((p(b)-p(a))/86400000);
}
function itemStatus(it,curKm,today){
  today=today||todayStr();
  const o={id:it.id,name:it.name,interval_km:it.interval_km,interval_months:it.interval_months,
    last_date:it.last_date,last_km:it.last_km,due_date:null,due_km:null,days_left:null,km_left:null,state:'none'};
  if(!it.last_date && it.last_km==null) return o;
  const rs=[];
  if(it.last_date && it.interval_months){
    o.due_date=addMonths(it.last_date,it.interval_months);
    o.days_left=daysBetween(today,o.due_date); rs.push(['d',o.days_left]);
  }
  if(it.last_km!=null && it.interval_km){
    o.due_km=it.last_km+it.interval_km;
    if(curKm!=null){o.km_left=o.due_km-curKm; rs.push(['k',o.km_left])}
  }
  let st='ok';
  for(const [k,left] of rs){
    if((k==='d'&&left<0)||(k==='k'&&left<=0)){st='overdue';break}
    if(left<=(k==='d'?WARN_DAYS:WARN_KM))st='soon';
  }
  o.state=rs.length?st:'ok';
  return o;
}
// ==/CORE==

const $=s=>document.querySelector(s);
const KEY='carcare.v1';
let mem=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{vehicles:{}}}catch(e){return mem||{vehicles:{}}}}
let DB=load();
function save(){mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('저장 공간을 쓸 수 없어요. 백업을 꼭 받아 두세요')}}
let plate=''; let editable=false;
try{plate=localStorage.getItem('cc.plate')||'';editable=sessionStorage.getItem('cc.edit')==='1'}catch(e){}

function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(k==='onclick')e.onclick=v;else if(k==='class')e.className=v;else e.setAttribute(k,v)}
  for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
async function run(fn){try{await fn()}catch(e){toast(e.message)}}
const fmt=n=>n==null?'-':n.toLocaleString();
function toInt(x){x=String(x??'').replace(/,/g,'').trim();if(x==='')return null;const n=Number(x);if(!Number.isInteger(n)||n<0)throw new Error('0 이상의 숫자를 입력해 주세요');return n}
function normPlate(p){p=(p||'').replace(/\s+/g,'');if(p.length<4||p.length>12)throw new Error('차량번호를 정확히 입력해 주세요 (예: 12가3456)');return p}

// 비밀번호 (이 폰 안에서 실수로 기록을 바꾸는 것을 막는 용도)
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  if(window.crypto&&crypto.subtle){
    const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:100000},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let a=0x811c9dc5;for(const c of salt+':'+pw){a^=c.charCodeAt(0);a=Math.imul(a,16777619)}return 'f'+(a>>>0).toString(16);
}
const newSalt=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
async function setPw(v,pw){
  if(pw.length<4)throw new Error('비밀번호는 4자 이상으로 정해 주세요');
  const salt=newSalt();v.pw={salt,hash:await hashPw(pw,salt)};
}

function newVehicle(){
  let id=1;
  return {pw:null,current_km:null,items:DEFAULTS.map(([name,km,mo])=>({id:id++,name,interval_km:km,interval_months:mo,last_date:null,last_km:null})),history:[],nextId:id};
}
const V=()=>DB.vehicles[plate];

function enter(p,editOk){plate=p;editable=editOk;
  try{localStorage.setItem('cc.plate',p);sessionStorage.setItem('cc.edit',editOk?'1':'0')}catch(e){}
  render()}
function logout(){plate='';editable=false;try{localStorage.removeItem('cc.plate');sessionStorage.removeItem('cc.edit')}catch(e){}render()}

function form(title,fields,onOk){
  const f=$('#dform');f.innerHTML='';f.append(h('b',{},title));
  const inputs={};
  for(const fl of fields){inputs[fl.key]=h('input',{type:fl.type||'text',inputmode:fl.type==='number'?'numeric':'',placeholder:fl.ph||'',value:fl.value??''});
    f.append(h('label',{},fl.label),inputs[fl.key])}
  f.append(h('div',{class:'btns',style:'margin-top:16px'},
    h('button',{type:'button',onclick:()=>run(async()=>{const v={};for(const k in inputs)v[k]=inputs[k].value;await onOk(v);$('#dlg').close()})},'저장'),
    h('button',{type:'button',class:'gr',onclick:()=>$('#dlg').close()},'취소')));
  $('#dlg').showModal()}

function login(){
  const app=$('#app');app.innerHTML='';
  const inp=h('input',{placeholder:'차량번호 (예: 12가3456)',value:plate});
  const pw=h('input',{type:'password',placeholder:'수정 비밀번호 (4자 이상)',autocomplete:'current-password'});
  const go=async withPw=>{
    const p=normPlate(inp.value),pass=withPw?pw.value:'';
    let v=DB.vehicles[p];
    if(!v){
      if(!pass)throw new Error('처음 사용하는 차량번호예요. 수정용 비밀번호를 정해 주세요');
      v=DB.vehicles[p]=newVehicle();await setPw(v,pass);save();return enter(p,true);
    }
    if(!pass)return enter(p,false);
    if(!v.pw){await setPw(v,pass);save();return enter(p,true)}
    if(await hashPw(pass,v.pw.salt)!==v.pw.hash)throw new Error('비밀번호가 맞지 않아요');
    enter(p,true)};
  app.append(h('h1',{},'🚗 차량 소모품 교체 알림'),
    h('div',{class:'card'},
      h('p',{class:'mu'},'차량번호로 내 기록을 불러와요. 처음이면 입력한 비밀번호가 수정용 비밀번호로 정해지고, 이후 기록을 바꾸려면 이 비밀번호가 필요해요.'),
      inp,h('div',{style:'height:8px'}),pw,
      h('div',{class:'btns'},
        h('button',{onclick:()=>run(()=>go(true))},'들어가기 (수정 가능)'),
        h('button',{class:'gr',onclick:()=>run(()=>go(false))},'보기만'))),
    backupCard(false));
}

function download(name,text){
  const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:'application/json'})),download:name});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backupCard(showExport){
  const c=h('div',{class:'card'},h('b',{},'백업'),
    h('p',{class:'mu'},'기록은 이 폰의 브라우저 안에만 저장돼요. 브라우저 데이터를 지우면 사라지니 가끔 백업해 두세요.'),
    h('div',{class:'btns'},
      showExport?h('button',{class:'sec',onclick:()=>{download('carcare-backup-'+todayStr()+'.json',JSON.stringify(DB));toast('백업 파일을 저장했어요')}},'백업 내보내기'):null,
      h('button',{class:'gr',onclick:()=>$('#restoreFile').click()},'백업 복원')));
  return c}
$('#restoreFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  run(async()=>{
    let d;try{d=JSON.parse(await f.text())}catch(_){throw new Error('백업 파일을 읽을 수 없어요')}
    if(!d||typeof d.vehicles!=='object')throw new Error('차량 소모품 백업 파일이 아니에요');
    if(!confirm('백업 파일로 현재 기록을 덮어쓸까요? ('+Object.keys(d.vehicles).length+'대)'))return;
    DB=d;save();toast('복원했어요');render()})};

function render(){
  if(!plate||!V()){if(plate&&!V())plate='';login();return}
  const v=V(),E=editable,app=$('#app');app.innerHTML='';
  app.append(h('div',{class:'top'},h('h1',{},'🚗 '+plate),
    h('div',{class:'btns',style:'margin:0'},
      E?h('button',{class:'sec',onclick:()=>form('비밀번호 변경',[{key:'pw',label:'새 비밀번호 (4자 이상)',type:'password'}],
        async f=>{await setPw(v,f.pw);save();toast('비밀번호를 바꿨어요')})},'비밀번호 변경'):null,
      h('button',{class:'gr',onclick:logout},E?'나가기':'로그인'))));
  if(!E)app.append(h('div',{class:'card'},h('span',{class:'mu'},'👀 보기 전용이에요. 수정하려면 "로그인"에서 비밀번호로 들어와 주세요.')));

  const sts=v.items.map(i=>itemStatus(i,v.current_km));
  const due=sts.filter(s=>s.state==='soon'||s.state==='overdue');
  if(due.length){
    const over=due.some(s=>s.state==='overdue');
    app.append(h('div',{class:'card alert '+(over?'':'soon')},h('b',{},(over?'🔴 ':'🟠 ')+'교체가 필요하거나 곧 필요해요'),
      due.map(s=>h('div',{class:'mu'},'• '+s.name+' — '+[
        s.due_date?(s.days_left>=0?'D-'+s.days_left:-s.days_left+'일 지남'):null,
        s.km_left!=null?(s.km_left>0?fmt(s.km_left)+'km 남음':fmt(-s.km_left)+'km 초과'):null].filter(Boolean).join(' / ')))));
  }

  if(E){
    const km=h('input',{type:'number',inputmode:'numeric',placeholder:'현재 주행거리(km)',value:v.current_km??''});
    app.append(h('div',{class:'card'},h('b',{},'현재 주행거리'),
      h('p',{class:'mu'},'앱을 열 때 갱신해 주면 "교체 300km 전" 표시가 정확해져요.'),
      h('div',{class:'row'},km,h('button',{onclick:()=>run(async()=>{
        v.current_km=toInt(km.value);save();render();toast('저장했어요')})},'저장'))));
  }else app.append(h('div',{class:'card'},h('b',{},'현재 주행거리'),h('p',{class:'mu'},v.current_km!=null?fmt(v.current_km)+'km':'-')));

  app.append(h('div',{class:'top'},h('b',{},'소모품'),
    E?h('button',{class:'sec',onclick:()=>form('소모품 추가',[
      {key:'name',label:'이름',ph:'예: 타이밍벨트'},
      {key:'interval_km',label:'교체 주기(km, 없으면 비움)',type:'number'},
      {key:'interval_months',label:'교체 주기(개월, 없으면 비움)',type:'number'}],
      async f=>{
        const name=f.name.trim();if(!name)throw new Error('이름을 입력해 주세요');
        const ik=toInt(f.interval_km),im=toInt(f.interval_months);
        if(!ik&&!im)throw new Error('주기(km 또는 개월)를 하나 이상 입력해 주세요');
        v.items.push({id:v.nextId++,name,interval_km:ik,interval_months:im,last_date:null,last_km:null});save();render()})},'+ 추가'):null));
  app.append(h('div',{style:'height:8px'}));

  const label={ok:'정상',soon:'곧 교체',overdue:'교체 필요',none:'기록 없음'};
  for(const it of sts){
    const lines=[];
    if(it.state==='none')lines.push(E?'교체 기록이 없어요. "교체했어요"로 입력해 주세요.':'교체 기록이 없어요.');
    else{
      lines.push('마지막 교체: '+(it.last_date||'-')+' / '+fmt(it.last_km)+'km');
      if(it.due_date)lines.push('다음 교체일: '+it.due_date+' ('+(it.days_left>=0?'D-'+it.days_left:-it.days_left+'일 지남')+')');
      if(it.due_km)lines.push('다음 교체 거리: '+fmt(it.due_km)+'km'+(it.km_left!=null?' ('+(it.km_left>0?fmt(it.km_left)+'km 남음':fmt(-it.km_left)+'km 초과')+')':''));
    }
    const raw=v.items.find(x=>x.id===it.id);
    app.append(h('div',{class:'card','data-item':it.name},
      h('div',{class:'item-h'},h('b',{},it.name),h('span',{class:'badge b-'+it.state},label[it.state])),
      lines.map(l=>h('div',{class:'mu'},l)),
      h('div',{class:'mu'},'주기: '+(it.interval_km?fmt(it.interval_km)+'km':'-')+' / '+(it.interval_months?it.interval_months+'개월':'-')),
      E?h('div',{class:'btns'},
        h('button',{onclick:()=>form(it.name+' 교체 기록',[
          {key:'date',label:'교체 날짜',type:'date',value:todayStr()},
          {key:'km',label:'교체 당시 주행거리(km)',type:'number',value:v.current_km??''}],
          async f=>{
            if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date))throw new Error('날짜를 입력해 주세요');
            const km=toInt(f.km);
            raw.last_date=f.date;raw.last_km=km;
            v.history.unshift({name:raw.name,done_date:f.date,done_km:km});v.history=v.history.slice(0,50);
            if(km!=null&&(v.current_km==null||v.current_km<km))v.current_km=km;
            save();render();toast('기록했어요')})},'교체했어요'),
        h('button',{class:'sec',onclick:()=>form(it.name+' 주기 수정',[
          {key:'interval_km',label:'교체 주기(km)',type:'number',value:raw.interval_km??''},
          {key:'interval_months',label:'교체 주기(개월)',type:'number',value:raw.interval_months??''}],
          async f=>{
            const ik=toInt(f.interval_km),im=toInt(f.interval_months);
            if(!ik&&!im)throw new Error('주기(km 또는 개월)를 하나 이상 입력해 주세요');
            raw.interval_km=ik;raw.interval_months=im;save();render()})},'주기 수정'),
        h('button',{class:'gr',onclick:()=>{if(confirm(it.name+' 항목을 삭제할까요?')){v.items=v.items.filter(x=>x.id!==it.id);save();render()}}},'삭제')):null));
  }

  if(v.history.length)app.append(h('div',{class:'card'},h('b',{},'교체 이력'),
    v.history.slice(0,30).map(x=>h('div',{class:'mu'},(x.done_date||'-')+'  '+x.name+'  '+fmt(x.done_km)+'km'))));
  app.append(backupCard(true));
}
render();
</script></body></html>
